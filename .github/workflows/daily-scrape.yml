name: Daily Competitive Intelligence Scrape

on:
  schedule:
    # 06:00 AM hora Perú (PET = UTC-5) → 11:00 AM UTC
    - cron: '0 11 * * *'
  # Permite ejecutar manualmente desde GitHub UI
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    name: Run daily scraper
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter scraper exec playwright install chromium --with-deps

      - name: Run scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_PAGESPEED_API_KEY: ${{ secrets.GOOGLE_PAGESPEED_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        run: pnpm scrape

      - name: Revalidate Vercel cache
        if: always()
        env:
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$NEXTAUTH_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::notice::NEXTAUTH_URL or REVALIDATE_SECRET not configured. Skipping Vercel revalidation."
            exit 0
          fi

          URL="${NEXTAUTH_URL%/}/api/revalidate?secret=${REVALIDATE_SECRET}"

          echo "Revalidating Vercel cache..."
          HTTP_STATUS=$(curl -s -o /tmp/revalidate-response.json -w "%{http_code}" "$URL" || true)

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/revalidate-response.json || true

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Vercel cache revalidated successfully."
          else
            echo "::notice::Vercel revalidation failed with HTTP $HTTP_STATUS, but scraper data was saved successfully."
          fi

          exit 0

      - name: Upload scrape logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_id }}
          path: apps/scraper/logs/
          retention-days: 14
